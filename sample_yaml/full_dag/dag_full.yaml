--- !DAG
id: stacd_dag_consolidated
name: STACD Consolidated DAG - Full Pipeline (map_1 + map_2 + map_3 + map_4)
version: "1.0"
description: "  Single DAG covering all 4 layer maps and all 40 algorithms."
params:
  - state
  - district
  - block
  - start_year
  - end_year
  - gee_account_id

alg_type_nodes:
  # Stage 1
  - Admin_Boundary
  # Stage 2
  - NREGA_Clip
  - MWS_Layer
  # map_2_1
  - Hydrology_Fortnightly
  - Hydrology_Annual
  # map_2_2
  - LULC_Algorithm
  - LULC_Vectorization
  - Cropping_Intensity
  - Crop_Grids
  - Change_Detection
  - Change_Detection_Vector
  - NDVI_Timeseries
  - Drought
  - Drought_Causality
  # map_3 independent
  - SOGE_Vector
  - Stream_Order
  - Restoration_Opportunity
  - Aquifer_Vector
  - Natural_Depression
  - Dist_to_Drainage
  - Catchment_Area
  - Slope_Percentage
  - LCW_Conflict
  - Agro_Ecological
  - Factory_CSR
  - Green_Credit
  - Mining
  - MWS_Connectivity
  - MWS_Centroid
  # map_3 dependent
  - SWB_Layer
  - ZOI
  # map_4
  - Drainage_Lines
  - CLART_Layer
  - Site_Suitability
  - Terrain_Algorithm
  - Terrain_Clusters
  - LULC_Terrain_Slope
  - LULC_Terrain_Plain
  - Tree_Health_CH_Raster
  - Tree_Health_CH_Vector
  - Tree_Health_CCD_Raster
  - Tree_Health_CCD_Vector
  - Tree_Health_OC_Raster
  - Tree_Health_OC_Vector

dataset_type_nodes:
  - Pan_India_MWS
  - Admin_Boundary_Asset
  - MWS_Boundaries
  - NREGA_Layer
  - Hydrology_Fortnightly_Asset
  - Hydrology_Annual_Asset
  - LULC_Raster
  - LULC_Vector
  - Cropping_Intensity_Asset
  - Crop_Grids_Asset
  - Change_Detection_Asset
  - Change_Detection_Vector_Asset
  - NDVI_Timeseries_Asset
  - Drought_Asset
  - Drought_Causality_Asset
  - SOGE_Vector_Asset
  - Stream_Order_Asset
  - Restoration_Opportunity_Asset
  - Aquifer_Vector_Asset
  - Natural_Depression_Asset
  - Dist_to_Drainage_Asset
  - Catchment_Area_Asset
  - Slope_Percentage_Asset
  - LCW_Conflict_Asset
  - Agro_Ecological_Asset
  - Factory_CSR_Asset
  - Green_Credit_Asset
  - Mining_Asset
  - MWS_Connectivity_Asset
  - MWS_Centroid_Asset
  - SWB_Layer_Asset
  - ZOI_Asset
  - Drainage_Lines_Asset
  - CLART_Layer_Asset
  - Site_Suitability_Asset
  - Terrain_Raster
  - Terrain_Vector
  - LULC_Terrain_Slope_Asset
  - LULC_Terrain_Plain_Asset
  - Tree_Health_CH_Raster_Asset
  - Tree_Health_CH_Vector_Asset
  - Tree_Health_CCD_Raster_Asset
  - Tree_Health_CCD_Vector_Asset
  - Tree_Health_OC_Raster_Asset
  - Tree_Health_OC_Vector_Asset

# ═══════════════════════════════════════════════
# EXECUTION STAGES (informational)
# ═══════════════════════════════════════════════
# Stage 1:  Admin_Boundary
# Stage 2:  NREGA_Clip, MWS_Layer                                          (parallel)
# Stage 3a: Hydrology_Fortnightly, Hydrology_Annual                        (parallel, after MWS_Layer)
# Stage 3b: LULC_Algorithm                                                  (after MWS_Layer)
# Stage 3c: Drainage_Lines, Terrain_Algorithm,                             (parallel, after MWS_Layer)
#           Tree_Health_*_Raster (x3), SOGE_Vector, Stream_Order,
#           Restoration_Opportunity, Aquifer_Vector, Natural_Depression,
#           Dist_to_Drainage, Catchment_Area, Slope_Percentage,
#           LCW_Conflict, Agro_Ecological, Factory_CSR, Green_Credit,
#           Mining, MWS_Connectivity, MWS_Centroid
# Stage 4a: LULC_Vectorization, Cropping_Intensity, Crop_Grids,           (parallel, after LULC)
#           Change_Detection, NDVI_Timeseries, Drought
# Stage 4b: CLART_Layer                                                     (after Drainage_Lines)
#           Terrain_Clusters                                                (after Terrain_Algorithm)
#           Tree_Health_*_Vector (x3)                                       (after respective rasters)
# Stage 5:  Change_Detection_Vector, Drought_Causality                    (after their parents)
#           LULC_Terrain_Slope, LULC_Terrain_Plain                         (after Terrain + LULC)
#           Site_Suitability                                                (after LULC)
#           SWB_Layer                                                       (after CatchmentArea + StreamOrder + DrainageLines)
# Stage 6:  ZOI                                                             (after SWBLayer + CroppingIntensity)

# ═══════════════════════════════════════════════
