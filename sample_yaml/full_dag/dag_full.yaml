# ═══════════════════════════════════════════════
# ALGORITHM TYPES
# ═══════════════════════════════════════════════

--- !Algorithm_Type
id: Admin_Boundary
name: Admin_Boundary
description: Root node. Clips tehsil boundary, pushes to GeoServer panchayat_boundaries workspace.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Pan_India_MWS
outputs:
  - Admin_Boundary_Asset
depends_on: []

--- !Algorithm_Type
id: NREGA_Clip
name: NREGA_Clip
description: Clips NREGA shapefile. Blocked pending soitehsil.geojson + AWS creds from Aman/Ankit.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Admin_Boundary_Asset
outputs:
  - NREGA_Layer
depends_on:
  - Admin_Boundary

--- !Algorithm_Type
id: MWS_Layer
name: MWS_Layer
description: Filters pan-India MWS V2 to tehsil, creates filtered_mws_uid GEE asset.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Pan_India_MWS
  - Admin_Boundary_Asset
outputs:
  - MWS_Boundaries
depends_on:
  - Admin_Boundary

--- !Algorithm_Type
id: Hydrology_Fortnightly
name: Hydrology_Fortnightly
description: Fortnightly hydrology raster. start_year always 2017 per Ankit sir.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
    default: 2017
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - MWS_Boundaries
outputs:
  - Hydrology_Fortnightly_Asset
depends_on:
  - MWS_Layer

--- !Algorithm_Type
id: Hydrology_Annual
name: Hydrology_Annual
description: Annual hydrology raster. start_year always 2017 per Ankit sir.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
    default: 2017
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - MWS_Boundaries
outputs:
  - Hydrology_Annual_Asset
depends_on:
  - MWS_Layer

--- !Algorithm_Type
id: LULC_Algorithm
name: LULC_Algorithm
description: Yearly LULC rasters (start_year to end_year). Critical prerequisite for 7+ downstream algos.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - MWS_Boundaries
outputs:
  - LULC_Raster
depends_on:
  - MWS_Layer

--- !Algorithm_Type
id: LULC_Vectorization
name: LULC_Vectorization
description: Vectorizes LULC raster into per-MWS area statistics.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - LULC_Raster
outputs:
  - LULC_Vector
depends_on:
  - LULC_Algorithm

--- !Algorithm_Type
id: Cropping_Intensity
name: Cropping_Intensity
description: Derives cropping intensity from LULC. Required by ZOI.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - ZOI_Asset
outputs:
  - Cropping_Intensity_Asset
depends_on:
  - ZOI

--- !Algorithm_Type
id: Crop_Grids
name: Crop_Grids
description: Generates crop grid GEE export.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - LULC_Raster
outputs:
  - Crop_Grids_Asset
depends_on:
  - LULC_Algorithm

--- !Algorithm_Type
id: Change_Detection
name: Change_Detection
description: 5 change types. Needs 6 LULC years minimum (start_year=2017 end_year>=2022).
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - LULC_Raster
outputs:
  - Change_Detection_Asset
depends_on:
  - LULC_Algorithm

--- !Algorithm_Type
id: Change_Detection_Vector
name: Change_Detection_Vector
description: Vectorizes change detection. GeoServer workspace changedetection.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
