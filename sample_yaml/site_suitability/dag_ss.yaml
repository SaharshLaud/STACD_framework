--- !DAG
id: Site_Suitability
name: Site_Suitability
version: "1.0"
description: "  Single DAG covering all 4 layer maps and all 40 algorithms."
params:
  - state
  - district
  - block
  - start_year
  - end_year
  - gee_account_id

alg_type_nodes:
  # Stage 1
  - Admin_Boundary
  # Stage 2
  
  - MWS_Layer
  
  # map_2_2
  - LULC_Algorithm
 
  
  - Site_Suitability
  
  
  
dataset_type_nodes:
  - Pan_India_MWS
  - Admin_Boundary_Asset
  - MWS_Boundaries
  - LULC_Raster
  - Site_Suitability_Asset
  



--- !Dataset_Type
id: Pan_India_MWS
name: Pan-India Micro-Watershed Boundaries V2
description: Public pan-India MWS V2 GEE asset. Root input for the entire pipeline.
format: GEEAsset

--- !Dataset_Type
id: Admin_Boundary_Asset
name: Admin Boundary Asset
description: Tehsil-level admin boundary GEE asset.
format: GEEAsset

--- !Dataset_Type
id: MWS_Boundaries
name: Micro-Watershed Boundaries
description: Filtered MWS boundaries for region of interest.
format: GEEAsset


--- !Dataset_Type
id: LULC_Raster
name: LULC Raster Output
description: Yearly LULC raster assets (start_year to end_year).
format: GEEAsset


--- !Dataset_Type
id: Site_Suitability_Asset
name: Site Suitability Asset
description: Plantation site suitability output.
format: GEEAsset


# ═══════════════════════════════════════════════
# ALGORITHM TYPES
# ═══════════════════════════════════════════════

--- !Algorithm_Type
id: Admin_Boundary
name: Admin_Boundary
description: Root node. Clips tehsil boundary, pushes to GeoServer panchayat_boundaries workspace.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Pan_India_MWS
outputs:
  - Admin_Boundary_Asset
depends_on: []

--- !Algorithm_Type
id: MWS_Layer
name: MWS_Layer
description: Filters pan-India MWS V2 to tehsil, creates filtered_mws_uid GEE asset.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Pan_India_MWS
  - Admin_Boundary_Asset
outputs:
  - MWS_Boundaries
depends_on:
  - Admin_Boundary


--- !Algorithm_Type
id: LULC_Algorithm
name: LULC_Algorithm
description: Yearly LULC rasters (start_year to end_year). Critical prerequisite for 7+ downstream algos.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - MWS_Boundaries
outputs:
  - LULC_Raster
depends_on:
  - MWS_Layer

--- !Algorithm_Type
id: Site_Suitability
name: Site_Suitability
description: Plantation site suitability. Depends on LULC raster.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - LULC_Raster
  - MWS_Boundaries
outputs:
  - Site_Suitability_Asset
depends_on:
  - LULC_Algorithm
  - MWS_Layer

