--- !DAG
id: dag2_extended_lulc
name: Extended LULC Workflow
version: 1.0
description: "4-node workflow: LULC raster → LULC vectorization"
params:
  - state
  - district
  - block
  - start_year
  - end_year
alg_type_nodes:
  - LULC_Algorithm           # ← SHARED with DAG 1!
  - LULC_Vectorization
dataset_type_nodes:
  - MWS_Boundaries           # ROOT DATASET
  - LULC_Raster
  - LULC_Vector

---
# Dataset Types
--- !Dataset_Type
id: MWS_Boundaries
name: Micro-Watershed Boundaries
description: Filtered micro-watershed boundaries for region of interest
format: GEEAsset

--- !Dataset_Type
id: LULC_Raster
name: LULC Raster Output
description: Land Use Land Cover raster
format: GEEAsset

--- !Dataset_Type
id: LULC_Vector
name: LULC Vector Output
description: Land Use Land Cover vector
format: GEEAsset

---
# Algorithm Types
--- !Algorithm_Type
id: LULC_Algorithm
name: LULC_Algorithm
description: Generate LULC raster for a region
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
input_datasets:
  - MWS_Boundaries
outputs:
  - LULC_Raster

--- !Algorithm_Type
id: LULC_Vectorization
name: LULC_Vectorization
description: Vectorize LULC raster
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
input_datasets:
  - LULC_Raster
outputs:
  - LULC_Vector
