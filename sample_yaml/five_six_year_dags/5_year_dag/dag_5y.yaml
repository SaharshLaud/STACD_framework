--- !DAG
id: 5_year_dag
name: dags which need to be triggered for 5 years
version: "1.0"
description: "  Single DAG covering all 4 layer maps and all 40 algorithms."
params:
  - state
  - district
  - block
  - start_year
  - end_year
  - gee_account_id

alg_type_nodes:
  - Admin_Boundary
  - MWS_Layer
  - LULC_Algorithm
  - Change_Detection
  - Change_Detection_Vector
  - Tree_Health_Raster
  - Tree_Health_Vector
  

dataset_type_nodes:
  - Pan_India_MWS
  - Admin_Boundary_Asset
  - MWS_Boundaries
  - LULC_Raster
  - Change_Detection_Asset
  - Change_Detection_Vector_Asset
  - Tree_Health_Raster_Asset
  - Tree_Health_Vector_Asset
  
  


--- !Dataset_Type
id: Pan_India_MWS
name: Pan-India Micro-Watershed Boundaries V2
description: Public pan-India MWS V2 GEE asset. Root input for the entire pipeline.
format: GEEAsset

--- !Dataset_Type
id: Admin_Boundary_Asset
name: Admin Boundary Asset
description: Tehsil-level admin boundary GEE asset.
format: GEEAsset

--- !Dataset_Type
id: MWS_Boundaries
name: Micro-Watershed Boundaries
description: Filtered MWS boundaries for region of interest.
format: GEEAsset


--- !Dataset_Type
id: LULC_Raster
name: LULC Raster Output
description: Yearly LULC raster assets (start_year to end_year).
format: GEEAsset


--- !Dataset_Type
id: Change_Detection_Asset
name: Change Detection Asset
description: 5 change detection rasters (Urbanization, Afforestation, Deforestation, Degradation, CropIntensity).
format: GEEAsset

--- !Dataset_Type
id: Change_Detection_Vector_Asset
name: Change Detection Vector Asset
description: Vectorized change detection. GeoServer workspace changedetection.
format: GeoServerLayer

--- !Dataset_Type
id: Tree_Health_Raster_Asset
name: Tree Health Canopy Height Raster
description: GeoServer workspace canopyheight.
format: GeoServerLayer

--- !Dataset_Type
id: Tree_Health_Vector_Asset
name: Tree Health Canopy Height Vector
description: Vectorized canopy height layer.
format: GEEAsset



# ═══════════════════════════════════════════════
# ALGORITHM TYPES
# ═══════════════════════════════════════════════

--- !Algorithm_Type
id: Admin_Boundary
name: Admin_Boundary
description: Root node. Clips tehsil boundary, pushes to GeoServer panchayat_boundaries workspace.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Pan_India_MWS
outputs:
  - Admin_Boundary_Asset
depends_on: []



--- !Algorithm_Type
id: MWS_Layer
name: MWS_Layer
description: Filters pan-India MWS V2 to tehsil, creates filtered_mws_uid GEE asset.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: gee_account_id
    type: integer
input_datasets:
  - Pan_India_MWS
  - Admin_Boundary_Asset
outputs:
  - MWS_Boundaries
depends_on:
  - Admin_Boundary



--- !Algorithm_Type
id: LULC_Algorithm
name: LULC_Algorithm
description: Yearly LULC rasters (start_year to end_year). Critical prerequisite for 7+ downstream algos.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - MWS_Boundaries
outputs:
  - LULC_Raster
depends_on:
  - MWS_Layer


--- !Algorithm_Type
id: Change_Detection
name: Change_Detection
description: 5 change types. Needs 6 LULC years minimum (start_year=2017 end_year>=2022).
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - LULC_Raster
outputs:
  - Change_Detection_Asset
depends_on:
  - LULC_Algorithm

--- !Algorithm_Type
id: Change_Detection_Vector
name: Change_Detection_Vector
description: Vectorizes change detection. GeoServer workspace changedetection.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - Change_Detection_Asset
outputs:
  - Change_Detection_Vector_Asset
depends_on:
  - Change_Detection

--- !Algorithm_Type
id: Tree_Health_Raster
name: Tree_Health_Raster
description: Canopy height raster. GeoServer workspace canopyheight.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - MWS_Boundaries
  - Change_Detection_Asset
outputs:
  - Tree_Health_Raster_Asset
depends_on:
  - MWS_Layer
  - Change_Detection

--- !Algorithm_Type
id: Tree_Health_Vector
name: Tree_Health_Vector
description: Vectorizes canopy height raster.
params:
  - name: state
    type: string
  - name: district
    type: string
  - name: block
    type: string
  - name: start_year
    type: integer
  - name: end_year
    type: integer
  - name: gee_account_id
    type: integer
input_datasets:
  - Tree_Health_Raster_Asset
outputs:
  - Tree_Health_Vector_Asset
depends_on:
  - Tree_Health_Raster
